<!--
  Deliberadamente NO se cargan aquí Chart.js, xlsx, JsBarcode, qrcode-generator
  ni tesseract.js: esta página solo necesita el lector de QR por cámara, así
  arranca más rápido en un celular en pleno recorrido por las aulas.

  El SDK de Firebase SÍ se incluye (igual que en index.html/login.html):
  detectarAlmacenamiento() prueba primero el servidor local y, si no lo
  encuentra, prueba Firebase — si el colegio usa Firebase como base de datos
  (sin servidor local corriendo), esta página necesita el SDK cargado para
  detectarlo y leer/guardar en la MISMA base de datos que el resto del
  sistema, no en el almacenamiento del navegador.
-->
